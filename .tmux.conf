unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

unbind C-b
unbind C-r
set-option -g prefix C-r
bind-key C-r send-prefix

set -g mouse on
set-option -g allow-rename off

bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

setw -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# p_bcopy on mac (remove _)
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set-option -g allow-rename off

setw -g clock-mode-colour '#FFFFFF'

setw -g window-status-style 'fg=#FFFFFF bg=#000000'
set -g status-style 'fg=#FFFFFF bg=#000000'
# set -g status-right '[%H:%M]'
set -g status-right ''

# bind c new-window -c "#{pane_current_path}"
bind -n C-a split-window -h -c "#{pane_current_path}"
bind -n C-s split-window -v -c "#{pane_current_path}"

bind c new-window -c "/Users/ivankovalenko/userland/homelab"
# bind '"' split-window -c "/Users/ivankovalenko/userland/homelab"
# bind % split-window -h -c "/Users/ivankovalenko/userland/homelab"

set -g pane-border-style 'fg=#330088'
set -g pane-active-border-style "bg=#000000 fg=#550000"

bind -n C-o next-window
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

bind -T multiKeyBindings l send-keys "clear"\; send-keys "Enter"\;
bind -n C-p switch-client -T multiKeyBindings
