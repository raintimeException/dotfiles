[window]
    dimensions = { columns = 100, lines = 25}

[colors.primary]
    foreground = "#ffffff"
    background = "#000000"

[font]
    normal = { family = "Iosevka", style = "Fixed" }
    size=18.0

[keyboard]
bindings = [
    { key = "F11", action = "ToggleFullScreen" },
]

[cursor]
    style = { shape = "Underline", blinking = "Always"}
